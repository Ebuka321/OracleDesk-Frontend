version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      stellar:
        patterns:
          - "@stellar/*"
          - "@creit.tech/*"
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
          - "@types/react*"
      dev-tooling:
        dependency-type: development
    ignore:
      # 2.6+ needs @stellar/stellar-sdk 17 and regenerated contract bindings.
      - dependency-name: "@creit.tech/stellar-wallets-kit"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "@stellar/stellar-sdk"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
